[package]
name = "forestui"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "A Terminal UI for managing Git worktrees"
readme = "README.md"
license = "MIT"
keywords = ["git", "worktree", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/flipbit03/forestui"

[[bin]]
name = "forestui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "1.3.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "sync",
] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
