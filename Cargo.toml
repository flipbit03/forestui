[package]
name = "forestui"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "A Terminal UI for managing Git worktrees"
readme = "README.md"
license = "MIT"
keywords = ["git", "worktree", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/flipbit03/forestui"
# The rewrite spec and its committed tu frames are 79 of the 115 files the crate
# would otherwise ship, and none of them are of any use to someone installing it.
exclude = ["doc/", "scripts/", ".github/", ".claude/", "install.sh", "CLAUDE.md", ".pre-commit-config.yaml"]

[[bin]]
name = "forestui"
path = "src/main.rs"

[features]
# Enabled only by the release build. It is how the binary knows it came from a
# GitHub release and may replace itself in place, rather than having been built
# by `cargo install`, where the update path is cargo's.
binary-release = []

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
# `default-features = false` + `rustls-tls` drops the native-tls/OpenSSL system
# dependency, which is what lets the musl release targets link statically.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
# Verifying the downloaded release binary against its published .sha256.
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "1.3.0"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "sync",
    # Staging and renaming the downloaded release binary.
    "fs",
] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
